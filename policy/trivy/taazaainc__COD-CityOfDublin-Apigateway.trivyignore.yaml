# Trivy exceptions for the AO API gateway. Every entry expires; see policy/README.md.
vulnerabilities:
  - id: CVE-2026-47890
    statement: "spring-webflux 6.2.19, fixed only in 7.0.9 (Spring Boot 4). Believed not reachable: needs SSE view fragments, and the gateway renders no views. Assessment from the gateway PR notes, to be confirmed by the approver. Requested by the AO gateway team, ticket DataService#4499 (request on DataService#4484). Remove when the gateway moves to Spring Boot 4"
    expired_at: 2027-02-15
  - id: CVE-2026-47892
    statement: "spring-webflux 6.2.19, fixed only in 7.0.9 (Spring Boot 4). Believed not reachable: needs WebFlux functional endpoints (RouterFunction) with headers() predicates, and the gateway has none; Spring Cloud Gateway routes through RoutePredicateHandlerMapping. Assessment from the gateway PR notes, to be confirmed by the approver. Requested by the AO gateway team, ticket DataService#4499 (request on DataService#4484). Remove when the gateway moves to Spring Boot 4"
    expired_at: 2027-02-15
